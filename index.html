<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Only Love</title>
    <style>
        /* === 基礎全黑與暗紅氛圍 === */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==============================
           1. 密碼登入畫面 (全泰語)
           ============================== */
        #login-screen {
            text-align: center;
            background: rgba(10, 10, 10, 0.98);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 50, 50, 0.3);
            border: 1px solid rgba(255, 100, 100, 0.2);
            width: 320px;
            z-index: 10;
        }

        h2 {
            color: #ffcccc;
            margin-bottom: 25px;
            font-size: 18px;
            letter-spacing: 1px;
        }

        #password-screen {
            background-color: #050505;
            border: 2px solid #550000;
            border-radius: 10px;
            height: 50px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            letter-spacing: 10px;
            color: #ff4d4d;
            box-shadow: inset 0 0 10px rgba(255,0,0,0.3);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .key-btn {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            color: #ffb3b3;
            border: 1px solid #333;
            border-radius: 12px;
            font-size: 22px;
            padding: 18px 0;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 3px 3px 6px #000, -1px -1px 3px #222;
        }

        .key-btn:active {
            transform: scale(0.95);
            background: #2a0000;
            border-color: #ff4d4d;
            box-shadow: inset 2px 2px 5px #000;
        }

        .btn-clear {
            color: #ff6666;
            font-size: 15px;
            font-weight: bold;
        }

        .btn-confirm {
            color: #ff99cc;
            font-size: 15px;
            font-weight: bold;
        }

        /* ==============================
           2. 天空城場景 (主內容 - 完全無提示)
           ============================== */
        #main-content {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #020111 0%, #191621 30%, #20202c 60%, #4a2f4a 100%);
            overflow: hidden;
            cursor: crosshair;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
        }

        .sky-city {
            position: absolute;
            bottom: 10%;
            right: -5%;
            width: 80%;
            height: 50%;
            background: rgba(255, 255, 255, 0.03);
            clip-path: polygon(0% 100%, 10% 80%, 15% 85%, 25% 60%, 30% 65%, 40% 40%, 50% 60%, 60% 30%, 70% 50%, 80% 10%, 90% 40%, 100% 100%);
            filter: blur(2px);
        }

        .platform {
            position: absolute;
            background: linear-gradient(to bottom, #333, #1a1a1a);
            border-bottom: 4px solid #444;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* --- 左下角：小天使 --- */
        .angel-container {
            position: absolute;
            bottom: 10%;
            left: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatAngel 3s ease-in-out infinite;
            z-index: 5;
            pointer-events: none;
        }

        .cloud-foot {
            width: 100px;
            height: 40px;
            background: #fff;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 5px 15px rgba(255,255,255,0.3);
        }
        .cloud-foot::after, .cloud-foot::before {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .cloud-foot::after { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud-foot::before { width: 40px; height: 40px; top: -15px; left: 50px; }

        .angel-body {
            width: 60px;
            height: 70px;
            background: #ffe0bd;
            border-radius: 30px 30px 10px 10px;
            position: relative;
            margin-bottom: -10px;
            display: flex;
            justify-content: center;
        }

        .eyes {
            position: absolute;
            top: 25px;
            width: 40px;
            display: flex;
            justify-content: space-between;
        }
        .eye {
            width: 8px;
            height: 10px;
            background: #333;
            border-radius: 50%;
        }

        .blush {
            position: absolute;
            top: 35px;
            width: 50px;
            display: flex;
            justify-content: space-between;
        }
        .blush-spot {
            width: 12px;
            height: 8px;
            background: rgba(255, 150, 150, 0.6);
            border-radius: 50%;
            filter: blur(1px);
        }

        .wings {
            position: absolute;
            top: 10px;
            width: 120px;
            display: flex;
            justify-content: space-between;
            z-index: -1;
        }
        .wing {
            width: 50px;
            height: 30px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px 50px 10px 50px;
        }
        .wing-right {
            border-radius: 50px 50px 50px 10px;
        }

        .halo {
            position: absolute;
            top: -15px;
            width: 40px;
            height: 10px;
            border: 3px solid #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700;
            animation: haloPulse 2s infinite;
        }

        /* --- 右邊中間：愛心 --- */
        .heart-container {
            position: absolute;
            top: 50%;
            right: 15%;
            transform: translateY(-50%);
            z-index: 5;
            pointer-events: none;
        }

        .big-heart {
            width: 80px;
            height: 80px;
            background-color: #ff3366;
            position: relative;
            transform: rotate(-45deg);
            animation: heartBeat 1.2s infinite;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.6);
        }

        .big-heart::after, .big-heart::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: #ff3366;
            border-radius: 50%;
        }
        .big-heart::after { top: -40px; left: 0; }
        .big-heart::before { top: 0; left: 40px; }

        .heart-platform {
            width: 120px;
            height: 15px;
            bottom: -50px;
            right: -20px;
        }

        #aim-line {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 8;
        }

        .flying-arrow {
            position: absolute;
            font-size: 24px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9;
            filter: drop-shadow(0 0 8px #ff3366);
        }

        /* ==============================
           3. 閉幕黑色頁面與互動效果 (花朵、泡泡、泰語、木板提示)
           ============================== */
        #fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2.5s ease;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .blooming-flower {
            font-size: 60px;
            opacity: 0;
            transform: scale(0);
            transition: all 1.5s ease 1s;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(255, 105, 180, 0.8));
        }

        .wooden-board {
            background: linear-gradient(135deg, #8B4513, #5C2C16);
            border: 3px solid #3d1c0b;
            border-radius: 12px;
            padding: 18px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s ease 1.5s;
            max-width: 80%;
            z-index: 1000;
        }

        .board-text {
            color: #ffccd5;
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* 最後黑幕頁面點擊產生的特效 (持續 3.5 秒後淡黑消失) */
        .click-effect-container {
            position: absolute;
            transform: translate(-50%, -100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 1002;
            animation: showAndFadeOut 3.5s forwards ease-in-out;
        }

        .click-flower {
            font-size: 24px;
            margin-bottom: 2px;
            animation: popUpFlower 0.3s ease-out;
        }

        .click-bubble {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 105, 180, 0.8);
            border-radius: 50%;
            animation: bubblePop 0.4s forwards ease-out;
        }

        .click-text {
            color: #ff99cc;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 71, 87, 0.9);
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 105, 180, 0.4);
        }

        @keyframes showAndFadeOut {
            0% { opacity: 1; transform: translate(-50%, -100%) scale(0.9); }
            70% { opacity: 1; transform: translate(-50%, -130px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -150px) scale(1.05); }
        }

        @keyframes popUpFlower {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes bubblePop {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        @keyframes floatAngel {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes haloPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        @keyframes heartBeat {
            0% { transform: translateY(-50%) rotate(-45deg) scale(1); }
            15% { transform: translateY(-50%) rotate(-45deg) scale(1.2); }
            30% { transform: translateY(-50%) rotate(-45deg) scale(1); }
            45% { transform: translateY(-50%) rotate(-45deg) scale(1.15); }
            100% { transform: translateY(-50%) rotate(-45deg) scale(1); }
        }
    </style>
</head>
<body>

    <!-- 背景音樂 -->
    <audio id="bgm" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=romantic-cute-wedding-112165.mp3" type="audio/mpeg">
    </audio>

    <!-- 1. 密碼登入畫面 (全泰語) -->
    <div id="login-screen">
        <h2>🔒 โปรดใส่รหัสผ่าน</h2>
        <div id="password-screen"></div>

        <div class="keypad">
            <button class="key-btn" onclick="pressNumber('1')">1</button>
            <button class="key-btn" onclick="pressNumber('2')">2</button>
            <button class="key-btn" onclick="pressNumber('3')">3</button>
            <button class="key-btn" onclick="pressNumber('4')">4</button>
            <button class="key-btn" onclick="pressNumber('5')">5</button>
            <button class="key-btn" onclick="pressNumber('6')">6</button>
            <button class="key-btn" onclick="pressNumber('7')">7</button>
            <button class="key-btn" onclick="pressNumber('8')">8</button>
            <button class="key-btn" onclick="pressNumber('9')">9</button>
            
            <button class="key-btn btn-clear" onclick="clearPassword()">ลบ</button>
            <button class="key-btn" onclick="pressNumber('0')">0</button>
            <button class="key-btn btn-confirm" onclick="checkPassword()">ยืนยัน</button>
        </div>
    </div>

    <!-- 2. 天空城場景 (完全無提示，純粹長按瞄準發射) -->
    <div id="main-content">
        <div class="stars"></div>
        <div class="sky-city"></div>

        <div class="platform" style="width: 150px; height: 20px; top: 20%; left: 30%;"></div>
        <div class="platform" style="width: 100px; height: 10px; top: 60%; left: 5%;"></div>

        <!-- 左下角：小天使 -->
        <div class="angel-container" id="angel">
            <div class="halo"></div>
            <div class="wings">
                <div class="wing wing-left"></div>
                <div class="wing wing-right"></div>
            </div>
            <div class="angel-body">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="blush">
                    <div class="blush-spot"></div>
                    <div class="blush-spot"></div>
                </div>
            </div>
            <div class="cloud-foot"></div>
        </div>

        <!-- 右邊中間：愛心目標 -->
        <div class="heart-container" id="target-heart">
            <div class="big-heart"></div>
            <div class="platform heart-platform"></div>
        </div>

        <canvas id="aim-line"></canvas>
    </div>

    <!-- 3. 最後的黑色頁面 (有木板提示、花朵，且點擊周圍會彈出花朵、泡泡與泰語告白) -->
    <div id="fade-overlay" onclick="handleFadeClick(event)">
        <div class="blooming-flower" id="flower">🌹</div>
        <div class="wooden-board" id="board" onclick="event.stopPropagation()">
            <div class="board-text">
                💡 คำแนะนำ: แตะที่หน้าจอเพื่อสำรวจข้อความ<br><br>
       
            </div>
        </div>
    </div>

    <script>
        let currentInput = "";
        const correctPassword = "101122";

        function pressNumber(num) {
            if (currentInput.length < 6) {
                currentInput += num;
                updateDisplay();
            }
        }

        function clearPassword() {
            currentInput = "";
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('password-screen').textContent = "•".repeat(currentInput.length);
        }

        function checkPassword() {
            if (currentInput === correctPassword) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.body.style.display = 'block';
                
                const bgm = document.getElementById('bgm');
                bgm.volume = 0.4;
                bgm.play().catch(e => console.log("BGM auto-play blocked"));

                initGame();
            } else {
                currentInput = "";
                updateDisplay();
            }
        }

        // 遊戲與瞄準發射邏輯
        let isAiming = false;
        let startX, startY;
        let currentX, currentY;
        let canvas, ctx;
        let gameFinished = false;

        function initGame() {
            canvas = document.getElementById('aim-line');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx = canvas.getContext('2d');

            const mainContent = document.getElementById('main-content');

            const getAngelPos = () => {
                const angelEl = document.getElementById('angel');
                const rect = angelEl.getBoundingClientRect();
                return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            };

            const startAim = (e) => {
                if (gameFinished) return;
                isAiming = true;
                const pos = getAngelPos();
                startX = pos.x;
                startY = pos.y;
                currentX = e.clientX || (e.touches && e.touches[0].clientX);
                currentY = e.clientY || (e.touches && e.touches[0].clientY);
            };

            const moveAim = (e) => {
                if (!isAiming || gameFinished) return;
                currentX = e.clientX || (e.touches && e.touches[0].clientX);
                currentY = e.clientY || (e.touches && e.touches[0].clientY);
                drawAimLine();
            };

            const endAim = (e) => {
                if (!isAiming || gameFinished) return;
                isAiming = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                fireArrow(startX, startY, currentX, currentY);
            };

            mainContent.addEventListener('mousedown', startAim);
            mainContent.addEventListener('mousemove', moveAim);
            mainContent.addEventListener('mouseup', endAim);

            mainContent.addEventListener('touchstart', startAim);
            mainContent.addEventListener('touchmove', moveAim);
            mainContent.addEventListener('touchend', endAim);
        }

        function drawAimLine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(currentX, currentY);
            ctx.strokeStyle = 'rgba(255, 71, 87, 0.7)';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function fireArrow(x1, y1, x2, y2) {
            const arrow = document.createElement('div');
            arrow.className = 'flying-arrow';
            arrow.innerHTML = '💘';
            document.getElementById('main-content').appendChild(arrow);

            const angle = Math.atan2(y2 - y1, x2 - x1);
            let posX = x1;
            let posY = y1;
            arrow.style.left = posX + 'px';
            arrow.style.top = posY + 'px';
            arrow.style.transform = `translate(-50%, -50%) rotate(${angle * (180 / Math.PI)}deg)`;

            const speed = 15;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;

            const targetHeart = document.getElementById('target-heart');

            const flyInterval = setInterval(() => {
                posX += vx;
                posY += vy;
                arrow.style.left = posX + 'px';
                arrow.style.top = posY + 'px';

                const targetRect = targetHeart.getBoundingClientRect();
                if (
                    posX >= targetRect.left &&
                    posX <= targetRect.right &&
                    posY >= targetRect.top &&
                    posY <= targetRect.bottom
                ) {
                    clearInterval(flyInterval);
                    arrow.remove();
                    gameFinished = true;
                    triggerFadeOut();
                    return;
                }

                if (posX < 0 || posX > window.innerWidth || posY < 0 || posY > window.innerHeight) {
                    clearInterval(flyInterval);
                    arrow.remove();
                }
            }, 20);
        }

        // 觸發最後黑幕頁面
        function triggerFadeOut() {
            const overlay = document.getElementById('fade-overlay');
            const flower = document.getElementById('flower');
            const board = document.getElementById('board');
            
            overlay.style.pointerEvents = 'auto';
            overlay.style.opacity = '1';
            
            flower.style.opacity = '1';
            flower.style.transform = 'scale(1)';
            
            board.style.opacity = '1';
            board.style.transform = 'translateY(0)';
        }

        // --- 最後黑幕頁面的點擊互動（花朵、泡泡、泰語告白，持續3.5秒後淡出） ---
        const thaiPhrases = [
            "ฉันรักเธอตลอดไป (我永遠愛你)",
            "ฉันเป็นของเธอคนเดียว (我只屬於你)",
            "รักจนแทบคลั่ง (愛到快發瘋)",
            "ขาดเธอไม่ได้ (不能沒有你)",
            "เธอคือทั้งหมดของฉัน (你是我的一切)",
            "รักเธอจนแทบจะคลั่งตาย (我愛你愛的生不如死)"
        ];
        let phraseIndex = 0;

        function handleFadeClick(e) {
            // 如果點到木板本身，不觸發背景點擊特效
            if (e.target.closest('#board')) return;

            const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
            const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

            if (clientX && clientY) {
                const container = document.createElement('div');
                container.className = 'click-effect-container';
                container.style.left = clientX + 'px';
                container.style.top = clientY + 'px';

                const bubble = document.createElement('div');
                bubble.className = 'click-bubble';

                const flower = document.createElement('div');
                flower.className = 'click-flower';
                flower.textContent = '🌸';

                const textDiv = document.createElement('div');
                textDiv.className = 'click-text';
                textDiv.textContent = thaiPhrases[phraseIndex];
                
                phraseIndex = (phraseIndex + 1) % thaiPhrases.length;

                container.appendChild(bubble);
                container.appendChild(flower);
                container.appendChild(textDiv);

                document.getElementById('fade-overlay').appendChild(container);

                // 3.5秒後自動淡出移除
                setTimeout(() => {
                    container.remove();
                }, 3500);
            }
        }
    </script>
</body>
</html>
